  // ==================== FUNÇÕES AUXILIARES ====================
  
  function showToast(message, duration = 2700) {
    let existing = document.querySelector('.toast-custom');
    if(existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast-custom';
    toast.innerHTML = `<i class="fas fa-seedling" style="margin-right: 8px;"></i> ${message}`;
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, duration);
  }

  function showLoader() {
    if(document.querySelector('.loader-overlay')) return;
    const overlay = document.createElement('div');
    overlay.className = 'loader-overlay';
    overlay.innerHTML = `<div class="loader-card"><i class="fas fa-spinner"></i> Preparando mensagem...</div>`;
    document.body.appendChild(overlay);
  }

  function hideLoader() {
    const loader = document.querySelector('.loader-overlay');
    if(loader) loader.remove();
  }

  function validateRequiredFields() {
    const allInputs = document.querySelectorAll('#formFieldsArea input, #formFieldsArea select, #formFieldsArea textarea');
    const criticalEmpty = Array.from(allInputs).filter(f => f.value.trim() === "" && f.type !== "button");
    if(criticalEmpty.length > 3) {
      if(!confirm("Atenção: vários campos estão vazios. Deseja enviar mesmo assim?")) return false;
    }
    return true;
  }

          <div class="form-group"><label>Variedade</label><select id="variedadeCiclo">${variedadesCompleta.map(v => `<option>${v}</option>`).join('')}</select></div>
          <div class="form-group"><label>Espaçamento do talhão</label><select id="espacamentoCiclo">${espacamentoOptions.map(e => `<option>${e}</option>`).join('')}</select></div>
          <div class="form-group"><label>Tipo de plantio</label><select id="tipoPlantioCiclo">${tipoPlantioOptions.map(t => `<option>${t}</option>`).join('')}</select></div>
        `;
      
      case "Alteração Ocupação":
        return `
          <div class="row-2"><div class="form-group"><label>Fazenda</label><input id="fazendaOcup"></div><div class="form-group"><label>Zona</label><input id="zonaOcup"></div></div>
          <div class="form-group"><label>Talhão</label><input id="talhaoOcup"></div>
          <div class="form-group"><label>Tipo de ocupação</label><select id="tipoOcupacao"><option>Devolução</option><option>Devolução (Subarrendamento Longo Prazo)</option><option>Repasse</option></select></div>
        `;
      
      case "Área de Danos":
        return `
          <div><label>Código Fundo Agrícola</label><input id="fundoDanos"></div>
          <div><label>Zona</label><input id="zonaDanos"></div>
          <div><label>Talhão</label><input id="talhaoDanos"></div>
          <div><label>Tipo de danos</label><textarea rows="2" id="tipoDanosDesc"></textarea></div>
        `;
      
      case "Reversão de Ordem de Corte":
        return `
          <div><label>Nº Ordem de Corte</label><input id="numOrdemRev"></div>
          <div><label>Código do fundo</label><input id="fundoRev"></div>
          <div class="row-2"><div><label>Zona</label><input id="zonaRev"></div><div><label>Nº talhão</label><input id="talhaoRev"></div></div>
          <div><label>Motivo da reversão</label><textarea rows="2" id="motivoReversao"></textarea></div>
        `;
      
      case "Pós Plantio":
        return `
          <div><label>Unidade produtora</label><input id="unidadeProdutora"></div>
          <div><label>Código fazenda</label><input id="codFazendaPos"></div>
          <div class="row-2"><div><label>Código zona</label><input id="zonaPos"></div><div><label>Talhão</label><input id="talhaoPos"></div></div>
          <div><label>Tipo Gestão</label><select id="tipoGestao"><option>FOCA</option><option>Repasse</option></select></div>
        `;
      
      case "Plantio":
        return `
          <div class="form-group"><label>Fazenda</label><input id="fazendaPlantio" placeholder="Fazenda"></div>
          <div class="form-group"><label>Sistema de plantio</label><select id="sistemaPlantio">${sistemaPlantioOptions.map(s => `<option>${s}</option>`).join('')}</select></div>
          <div class="row-2">
            <div class="form-group"><label>Espaçamento</label><select id="espacamentoPlantio">${espacamentoOptions.map(e => `<option>${e}</option>`).join('')}</select></div>
            <div class="form-group"><label>Ciclo desenvolvimento</label><select id="cicloPlantio">${cicloDesenvolvimentoCurtoOptions.map(c => `<option>${c}</option>`).join('')}</select></div>
          </div>
          <div class="row-2">
            <div class="form-group"><label>Zona</label><input id="zonaPlantio" placeholder="Zona"></div>
            <div class="form-group"><label>Variedade</label><select id="variedadePlantio">${variedadesCompleta.map(v => `<option>${v}</option>`).join('')}</select></div>
          </div>
          <div class="row-2">
            <div class="form-group"><label>Talhão</label><input id="talhaoPlantio" placeholder="Talhão"></div>
            <div class="form-group"><label>Área (ha)</label><input type="number" step="0.1" id="areaHaPlantio" placeholder="Área em hectares"></div>
          </div>
          <div class="row-2">
            <div class="form-group"><label>Frente</label><input id="frentePlantio" placeholder="Frente"></div>
            <div class="form-group"><label>Quantidade de pessoas</label><input type="number" id="qtdPessoasPlantio" placeholder="Qtd"></div>
          </div>
          <div class="form-group"><label>Área restante (ha)</label><input type="number" step="0.1" id="areaRestantePlantio" placeholder="Área restante"></div>
        `;
      
      default: return `<p>Formulário não disponível</p>`;
    }
  }

  // ==================== FUNÇÕES DE GESTÃO ====================
  
  function collectFormData() {
    const fields = document.querySelectorAll('#formFieldsArea input, #formFieldsArea select, #formFieldsArea textarea');
    let dataObj = {};
    fields.forEach(field => { if(field.id) dataObj[field.id] = field.value; });
    return dataObj;
  }

  function restoreDraftToForm(draft) {
    if(!draft || draft.tipo !== currentTicketType) return false;
    const dados = draft.dados;
    for(let [key, value] of Object.entries(dados)) {
      const inputEl = document.getElementById(key);
      if(inputEl) inputEl.value = value;
    }
    showToast("Rascunho carregado automaticamente");
    return true;
  }

  function saveCurrentDraft() {
    const formData = collectFormData();
    const draft = { tipo: currentTicketType, dados: formData, timestamp: Date.now() };
    localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(draft));
    showToast("Rascunho salvo com sucesso!");
  }

  function tryLoadDraftOnEnter() {
    const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
    if(raw) {
      try {
        const draft = JSON.parse(raw);
        if(draft.tipo === currentTicketType) restoreDraftToForm(draft);
      } catch(e) {}
    }
  }

  function generateWhatsAppMessage() {
    const formData = collectFormData();
    let msg = "*CHAMADO AGRICOLA: " + currentTicketType + "*%0A%0A";
    for(let [key, value] of Object.entries(formData)) {
      if(value && value.trim() !== "") {
        let label = key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
        label = label.replace(/([a-z])([A-Z])/g, '$1 $2');
        msg += "> " + label + ": " + value.trim() + "%0A";
      }
    }
    msg += "%0A---%0AEnviado via Agro-Chamados - Gestao Agricola";
    return msg;
  }

  function openWhatsApp() {
    const messageText = generateWhatsAppMessage();
    const url = `https://wa.me/?text=${messageText}`;
    window.open(url, '_blank');
    showToast("Escolha o contato no WhatsApp...");
  }

  function handleSubmit() {
    if(!validateRequiredFields()) return;
    showLoader();
    setTimeout(() => { openWhatsApp(); hideLoader(); }, 300);
  }

  function renderTypeSelection() {
    typesContainer.innerHTML = "";
    tiposChamado.forEach(tipo => {
      const card = document.createElement('div');
      card.className = 'type-card';
      let iconHtml = '<i class="fas fa-clipboard-list"></i>';
      if(tipo.includes("Alteração")) iconHtml = '<i class="fas fa-exchange-alt"></i>';
      else if(tipo.includes("Fechamento")) iconHtml = '<i class="fas fa-cut"></i>';
      else if(tipo.includes("Danos")) iconHtml = '<i class="fas fa-tree"></i>';
      else if(tipo.includes("Ativar")) iconHtml = '<i class="fas fa-toggle-on"></i>';
      else if(tipo.includes("Reforma")) iconHtml = '<i class="fas fa-calendar-alt"></i>';
      else if(tipo.includes("Reversão")) iconHtml = '<i class="fas fa-undo-alt"></i>';
      else if(tipo.includes("Plantio")) iconHtml = '<i class="fas fa-tractor"></i>';
      else if(tipo.includes("Exceções")) iconHtml = '<i class="fas fa-exclamation-triangle"></i>';
      else if(tipo.includes("Ciclo")) iconHtml = '<i class="fas fa-chart-line"></i>';
      else if(tipo.includes("Estimativa")) iconHtml = '<i class="fas fa-calculator"></i>';
      card.innerHTML = `${iconHtml}<span>${tipo}</span>`;
      card.addEventListener('click', () => openFormForType(tipo));
      typesContainer.appendChild(card);
    });
  }

  function openFormForType(type) {
    currentTicketType = type;
    formDynamicTitle.innerText = type;
    formFieldsArea.innerHTML = getFormHtmlByType(type);
    homeScreen.classList.add('hidden');
    typeScreen.classList.add('hidden');
    formScreen.classList.remove('hidden');
    tryLoadDraftOnEnter();
  }

  function goToHome() {
    homeScreen.classList.remove('hidden');
    typeScreen.classList.add('hidden');
    formScreen.classList.add('hidden');
    currentTicketType = "";
  }

  function goToTypeSelection() {
    homeScreen.classList.add('hidden');
    typeScreen.classList.remove('hidden');
    formScreen.classList.add('hidden');
    renderTypeSelection();
  }

  // ==================== EVENT LISTENERS ====================
  
  document.getElementById('newChamadoBtn').addEventListener('click', goToTypeSelection);
  document.getElementById('infoAppBtn').addEventListener('click', () => {
    alert("🌱 AgroChamados Profissional v5.0\n\n✅ TODOS OS CAMPOS CORRIGIDOS:\n• Listas suspensas em todos os formulários\n• Variedades ordenadas A-Z\n• Espaçamentos e demais listas em ordem numérica\n\n⚠️ Nenhum campo com digitação onde há lista disponível!");
  });
  document.getElementById('backHomeFromType').addEventListener('click', goToHome);
  document.getElementById('backToType').addEventListener('click', goToTypeSelection);
  submitBtn.addEventListener('click', handleSubmit);
  saveDraftBtn.addEventListener('click', saveCurrentDraft);

  renderTypeSelection();
</script>
</body>
</html>
